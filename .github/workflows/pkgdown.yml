name: Build and deploy pkgdown site

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.actor != 'github-actions[bot]' ||
      github.event.pull_request.user.login == 'github-actions[bot]'
    concurrency:
      group: pkgdown-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      BIFROST_ARTIFACT_DIR: ${{ github.workspace }}/data-remote
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/pkgdown-browser-smoke/package-lock.json

      - name: Install R dependencies (incl. pkgdown)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site into docs/
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE
          )
          source("tools/finalize-pkgdown-home.R")

      - name: Install pkgdown browser smoke dependencies
        run: npm ci --prefix tools/pkgdown-browser-smoke

      - name: Install Chromium for pkgdown browser smoke tests
        run: npx --prefix tools/pkgdown-browser-smoke playwright install --with-deps chromium

      - name: Test built pkgdown site in Chromium
        run: npm test --prefix tools/pkgdown-browser-smoke

      - name: Restore cached vignette PDFs
        id: vignette-pdf-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/vignette-artifacts
          key: vignette-pdfs-${{ runner.os }}-${{ hashFiles('vignettes/**/*.Rmd', 'vignettes/**/*.png', 'vignettes/**/*.gif', 'vignettes/**/*.jpg', 'vignettes/**/*.jpeg', 'vignettes/**/*.svg', 'vignettes/**/*.csv', 'vignettes/**/*.txt', 'vignettes/**/*.rds', 'vignettes/**/*.RDS', 'vignettes/**/*.R', 'R/**', 'data-remote/**', 'DESCRIPTION', '_pkgdown.yml', 'pkgdown/**', '.github/workflows/pkgdown.yml', 'tools/vignette_artifacts.R', 'tools/render-vignette-pdf.R', 'tools/build-colab-notebook.py', 'tools/colab_dependencies.py', 'tools/test-vignette-artifacts.py', 'tools/vignette_artifact_checks/**', 'tools/validate-pkgdown-config.R', 'tools/pkgdown-browser-smoke/**') }}
          restore-keys: |
            vignette-pdfs-${{ runner.os }}-

      - name: Restore PDFs into docs/
        run: Rscript tools/vignette_artifacts.R restore-pdfs --pdf-dir docs/articles --cache-dir .cache/vignette-artifacts

      - name: Plan PDF renders
        id: vignette-pdfs
        shell: bash
        run: |
          slugs="$(Rscript tools/vignette_artifacts.R plan --target pdf --artifact-dir docs/articles --cache-dir .cache/vignette-artifacts --sep space)"
          echo "slugs=${slugs}" >> "$GITHUB_OUTPUT"
          if [ -n "$slugs" ]; then
            echo "Rendering PDFs for: $slugs"
          else
            echo "All vignette PDFs restored from cache."
          fi

      - name: Render changed vignette PDFs
        if: steps.vignette-pdfs.outputs.slugs != ''
        shell: bash
        run: |
          for slug in ${{ steps.vignette-pdfs.outputs.slugs }}; do
            Rscript tools/render-vignette-pdf.R "$slug" --output-dir docs/articles
          done

      - name: Update vignette PDF cache
        run: Rscript tools/vignette_artifacts.R update-cache --pdf-dir docs/articles --cache-dir .cache/vignette-artifacts

      - name: Save vignette PDF cache
        if: steps.vignette-pdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/vignette-artifacts
          key: ${{ steps.vignette-pdf-cache.outputs.cache-primary-key }}

      - name: Upload site artifact for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
