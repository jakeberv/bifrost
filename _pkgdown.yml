url: https://jakeberv.com/bifrost/
# Vignettes are tracked in this source checkout so pkgdown can build articles,
# but .Rbuildignore excludes vignettes/ from the package tarball.
articles:
  - title: Project Status
    desc: Release availability and development-version differences.
    contents:
      - articles/development-status
  - title: Background
    navbar: Background
    contents:
      - theoretical-background-vignette
      - pca-model-selection-and-bifrost-vignette
  - title: Getting Started
    navbar: Getting Started
    contents:
      - quick-start-vignette
      - jaw-shape-vignette
  - title: Rate Mapping
    navbar: Rate Mapping
    contents:
      - rate-map-jaw-shape-vignette
      - rate-map-jaw-shape-part-2-comparisons
  - title: Avian Skeleton Case Study
    navbar: Avian Skeleton Case Study
    contents:
      - avian-skeleton-part-1
      - avian-skeleton-part-2
      - avian-skeleton-part-3
      - avian-skeleton-part-4
      - avian-skeleton-part-5
  - title: Simulation and Calibration
    navbar: Simulation and Calibration
    contents:
      - simulation-study-part-1
      - simulation-study-part-2
template:
  bootstrap: 5
  math-rendering: katex
  includes:
    in_header: |
      <script data-goatcounter="https://bifrost.goatcounter.com/count"
              async src="https://gc.zgo.at/count.js"></script>
